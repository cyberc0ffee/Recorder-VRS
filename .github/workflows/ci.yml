name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check backend
          black --check backend
      - name: Start a test RTSP stream (MediaMTX + ffmpeg test pattern)
        run: |
          docker run -d --name mediamtx -p 8554:8554 bluenviron/mediamtx:1.9.3
          sleep 3
          nohup ffmpeg -hide_banner -loglevel error -re \
            -f lavfi -i testsrc=size=320x240:rate=10 \
            -c:v libx264 -preset ultrafast -tune zerolatency -g 10 \
            -f rtsp rtsp://127.0.0.1:8554/test > publisher.log 2>&1 &
          sleep 3
      - name: Tests
        env:
          RTSP_TEST_URL: rtsp://127.0.0.1:8554/test
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rtsp-recorder:ci .
